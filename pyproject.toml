[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poverty-dashboard"
version = "0.1.0"
description = "Internal PolicyEngine dashboard for federal and per-state baseline poverty / child poverty checks"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "microdf-python>=1.3.0",
    "modal>=0.66.0",
    "policyengine[us]==5.3.0",
    "policyengine-core==3.30.1",
    "policyengine-us==1.764.6",
    "spm-calculator==0.3.1",
    "pydantic>=2.0",
    "tables>=3.10.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
poverty-dashboard-compute = "poverty_dashboard.compute_local:main"
poverty-dashboard-precompute = "poverty_dashboard.precompute_baseline:main"
poverty-dashboard-spm-elements = "poverty_dashboard.spm_elements:main"
poverty-dashboard-spm-diagnostics = "poverty_dashboard.spm_diagnostics:main"

[tool.setuptools.packages.find]
include = ["poverty_dashboard*", "scripts*"]

[tool.setuptools.package-data]
poverty_dashboard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
