[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poverty-dashboard"
version = "0.1.0"
description = "Internal PolicyEngine dashboard for federal and per-state baseline poverty / child poverty checks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "microdf-python>=1.3.0",
    "modal>=0.66.0",
    "policyengine>=4.5.1",
    "policyengine-us>=1.691.11",
    "pydantic>=2.0",
    "tables>=3.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
poverty-dashboard-compute = "poverty_dashboard.compute_local:main"
poverty-dashboard-precompute = "poverty_dashboard.precompute_baseline:main"
poverty-dashboard-spm-elements = "poverty_dashboard.spm_elements:main"
poverty-dashboard-spm-diagnostics = "poverty_dashboard.spm_diagnostics:main"

[tool.setuptools.packages.find]
include = ["poverty_dashboard*", "scripts*"]

[tool.setuptools.package-data]
poverty_dashboard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
